# Hertz generator templates.
# Replace YOUR_GO_MODULE before running `make hz`.
# This file intentionally contains only generic generator wiring; business code
# belongs in the generated handler's application calls.
layouts:
  - path: handler.go
    delims:
      - "{{"
      - "}}"
    body: |-
      // Code generated by hertz generator.

      package {{.PackageName}}

      import (
        "context"
        "net/http"

        "github.com/cloudwego/hertz/pkg/app"
        "YOUR_GO_MODULE/application"

      {{- range $k, $v := .Imports}}
        {{$k}} "{{$v.Package}}"
      {{- end}}
      )

      {{range $_, $MethodInfo := .Methods}}
      {{$MethodInfo.Comment}}
      func {{$MethodInfo.Name}}(infra *application.App) app.HandlerFunc {
        return func(ctx context.Context, c *app.RequestContext) {
          var err error
          {{if ne $MethodInfo.RequestTypeName "" -}}
          var req {{$MethodInfo.RequestTypeName}}
          err = c.BindAndValidate(&req)
          if err != nil {
            c.String(http.StatusBadRequest, "bad request: %v", err)
            return
          }
          {{end}}
          resp := new({{$MethodInfo.ReturnTypeName}})
          _ = ctx
          _ = resp
          _ = err
          // TODO: call an application use case and write the unified envelope.
        }
      }
      {{end}}

  - path: router.go
    delims:
      - "{{"
      - "}}"
    body: |-
      // Code generated by hertz generator. DO NOT EDIT.

      package {{$.PackageName}}

      import (
        "github.com/cloudwego/hertz/pkg/app/server"
        "YOUR_GO_MODULE/application"

      {{- range $k, $v := .HandlerPackages}}
        {{$k}} "{{$v}}"
      {{- end}}
      )

      func Register(r *server.Hertz, infra *application.App) {
        // Keep route registration generated from IDL.
      }

